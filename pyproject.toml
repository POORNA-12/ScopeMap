[project]
name = "scopemap"
version = "0.1.0"
description = "Understand the scope of a change before you merge it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
scopemap = "scopemap.cli:main"

[project.optional-dependencies]
ts = [
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
js = [
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
]
viz = [
    "rich>=13.7.0",
]
all = [
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project_excludes = ["__pyrefly_virtual__", ".venv", "venv", "__pycache__", ".git", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "build", "dist", "node_modules", "fixtures"]
